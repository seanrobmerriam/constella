<fieldset class="form-fieldset columns">
  <legend
    class="form-fieldset_legend form-fieldset_legend-heading text-style-h5"
  >
    Your details
  </legend>
  <div class="form-fieldset_fields">
    <label class="field form-input">
      <span class="field-label text-style-main"
        ><span>First name</span
        ><span class="field-star" aria-hidden="true">*</span></span
      >
      <input
        class="field-control text-style-main"
        type="text"
        name="first-name"
        placeholder="First name"
        inputmode="text"
        autocomplete="given-name"
        required
      />
    </label>
    <label class="field form-input">
      <span class="field-label text-style-main"
        ><span>Last name</span
        ><span class="field-star" aria-hidden="true">*</span></span
      >
      <input
        class="field-control text-style-main"
        type="text"
        name="last-name"
        placeholder="Last name"
        inputmode="text"
        autocomplete="family-name"
        required
      />
    </label>
  </div>
</fieldset>

<fieldset class="form-fieldset inline">
  <legend
    class="form-fieldset_legend form-fieldset_legend-label field-label text-style-main"
  >
    Contact by
  </legend>
  <div class="form-fieldset_fields">
    <label class="form-choice">
      <input
        class="form-choice_input"
        type="radio"
        name="contact"
        value="email"
        checked
      />
      <span class="form-choice_mark" aria-hidden="true"
        ><span class="form-choice_dot"></span
      ></span>
      <span class="form-choice_text text-style-main">Email</span>
    </label>
    <label class="form-choice">
      <input
        class="form-choice_input"
        type="radio"
        name="contact"
        value="phone"
      />
      <span class="form-choice_mark" aria-hidden="true"
        ><span class="form-choice_dot"></span
      ></span>
      <span class="form-choice_text text-style-main">Phone</span>
    </label>
  </div>
</fieldset>
