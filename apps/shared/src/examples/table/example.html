<div
  class="table_wrap"
  role="region"
  aria-labelledby="plans-caption"
  tabindex="0"
>
  <table class="table striped">
    <caption id="plans-caption">
      Plans and prices
    </caption>
    <thead>
      <tr>
        <th scope="col">Plan</th>
        <th scope="col">For</th>
        <th scope="col" class="is-numeric">Seats</th>
        <th scope="col" class="is-numeric">Price per month</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Starter</th>
        <td>One person and a side project</td>
        <td class="is-numeric">1</td>
        <td class="is-numeric">$0</td>
      </tr>
      <tr>
        <th scope="row">Team</th>
        <td>A small team shipping every week</td>
        <td class="is-numeric">10</td>
        <td class="is-numeric">$49</td>
      </tr>
      <tr>
        <th scope="row">Studio</th>
        <td>Agencies with several client sites</td>
        <td class="is-numeric">50</td>
        <td class="is-numeric">$199</td>
      </tr>
      <tr>
        <th scope="row">Enterprise</th>
        <td>Single sign-on, audit logs and support</td>
        <td class="is-numeric">500</td>
        <td class="is-numeric">$1,200</td>
      </tr>
    </tbody>
  </table>
</div>
