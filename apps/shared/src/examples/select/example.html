<label class="field form-select">
  <span class="field-label text-style-main"
    ><span>Topic</span
    ><span class="field-star" aria-hidden="true">*</span></span
  >
  <span class="form-select_control">
    <select
      class="field-control form-select_field text-style-main"
      name="topic"
      required
    >
      <option value="" disabled selected hidden>Select one…</option>
      <option value="sales">Sales</option>
      <option value="support">Support</option>
      <option value="press">Press</option>
    </select>
    <svg
      class="icon small form-select_mark"
      viewBox="0 0 66 70"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M17 2L50 34.9999L17 68"
        stroke="currentColor"
        vector-effect="non-scaling-stroke"
        style="stroke-width: var(--border-width)"
      />
    </svg>
  </span>
</label>
