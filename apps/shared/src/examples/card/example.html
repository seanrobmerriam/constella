<ul class="grid" style="--_cols-sm: 2; --_cols-lg: 3">
  <li class="card_wrap">
    <div class="card_content margin-trim">
      <p class="heading eyebrow text-style-small">Guide</p>
      <h3 class="heading text-style-h5">Default card</h3>
      <p class="text">A tinted surface. Its button is secondary.</p>
      <div class="input-wrapper">
        <a class="button_wrap secondary" href="#"
          ><span class="button_text text-style-trim">Read the guide</span></a
        >
      </div>
    </div>
  </li>

  <li class="card_wrap cover theme-dark">
    <div class="card_visual">
      <img
        class="image"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ebe65b'/%3E%3Cstop offset='1' stop-color='%23453e42'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='400' fill='url(%23s)'/%3E%3Cpath d='M0 300 L170 170 L300 270 L420 190 L600 320 V400 H0Z' fill='%231f1d1e'/%3E%3C/svg%3E"
        alt=""
      />
      <div class="overlay gradient" style="--_strength: 50"></div>
    </div>
    <div class="card_content margin-trim">
      <p class="heading eyebrow text-style-small">Story</p>
      <h3 class="heading text-style-h5">Cover card</h3>
      <p class="text">The image fills the card behind the text.</p>
      <div class="input-wrapper">
        <a class="button_wrap" href="#"
          ><span class="button_text text-style-trim">Read the story</span></a
        >
      </div>
    </div>
  </li>

  <li class="card_wrap stacked">
    <div class="card_visual">
      <img
        class="image"
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ebe65b'/%3E%3Cstop offset='1' stop-color='%23453e42'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='400' fill='url(%23s)'/%3E%3Cpath d='M0 300 L170 170 L300 270 L420 190 L600 320 V400 H0Z' fill='%231f1d1e'/%3E%3C/svg%3E"
        alt=""
      />
    </div>
    <div class="card_content margin-trim">
      <p class="heading eyebrow text-style-small">Update</p>
      <h3 class="heading text-style-h5">Stacked card</h3>
      <p class="text">The image sits above, with no surface.</p>
      <div class="input-wrapper">
        <a class="button_wrap link" href="#"
          ><span class="button_text text-style-trim">Read the update</span></a
        >
      </div>
    </div>
  </li>
</ul>
