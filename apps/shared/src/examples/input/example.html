<div class="flex-vertical-nowrap gap-5">
  <label class="field form-input">
    <span class="field-label text-style-main"
      ><span>Email</span
      ><span class="field-star" aria-hidden="true">*</span></span
    >
    <input
      class="field-control text-style-main"
      type="email"
      name="email"
      placeholder="Email"
      inputmode="email"
      autocomplete="email"
      required
    />
  </label>
  <label class="field form-input">
    <span class="field-label text-style-main"><span>First name</span></span>
    <input
      class="field-control text-style-main"
      type="text"
      name="first-name"
      placeholder="First name"
      inputmode="text"
      autocomplete="given-name"
    />
  </label>
  <label class="field form-input" data-size="small" data-radius="round">
    <span class="field-label text-style-main sr-only"><span>Search</span></span>
    <input
      class="field-control text-style-main"
      type="search"
      name="q"
      placeholder="Search the docs"
      inputmode="search"
      autocomplete="off"
    />
  </label>
</div>
